<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f1f1f2" />
    <title>Baroda Lending Desk (Demo)</title>
    <meta name="description" content="A demo of agentic AI in personal-loan processing at a bank branch: AI reads, checks and recommends; people decide. Synthetic data; not a Bank of Baroda service." />
    <!-- Desktop only: phones and tablets get a message instead of the site. -->
    <style>
      html[data-desktop-only]{display:flex!important;flex-direction:column;align-items:center;justify-content:center;height:100%;margin:0;padding:32px;box-sizing:border-box;overflow:hidden!important;background:#0f172a!important;color:#f1f5f9;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
      html[data-desktop-only] body{display:none!important}
      html[data-desktop-only]::before{content:"Please open this website on a laptop or desktop";max-width:340px;font-size:22px;font-weight:700;line-height:1.3}
      html[data-desktop-only]::after{content:"It is built for larger screens and is not available on phones or tablets.";max-width:340px;margin-top:12px;font-size:15px;color:#94a3b8}
      /* A desktop window narrower than the layout needs (about 1024 CSS px): ask for a wider window instead. */
      @media (max-width: 1023px){
        html:not([data-desktop-only]){display:flex!important;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;box-sizing:border-box;overflow:hidden!important;background:#f1f1f2!important;color:#0b0b0c;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
        html:not([data-desktop-only]) body{display:none!important}
        html:not([data-desktop-only])::before{content:"Please widen this window";font-size:22px;font-weight:700;line-height:1.3}
        html:not([data-desktop-only])::after{content:"Baroda Lending Desk is laid out for laptop and desktop screens, at least about 1024 pixels wide.";max-width:360px;margin-top:12px;font-size:15px;color:#6b6b74}
      }
    </style>
    <script>
      (function () {
        try {
          var n = navigator, ua = n.userAgent || '';
          var mq = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
          if ((n.userAgentData && n.userAgentData.mobile) ||
              /Android|iPhone|iPad|iPod|Mobile|Tablet|Silk|Kindle|PlayBook|BlackBerry|BB10|Opera Mini|IEMobile|webOS/i.test(ua) ||
              (/Macintosh/.test(ua) && n.maxTouchPoints > 1) ||          // iPadOS asking for the desktop site
              (mq('(pointer: coarse)') && !mq('(any-pointer: fine)')) ||   // touch-only screen with a desktop user agent
              (navigator.maxTouchPoints>0&&(Math.min(screen.width,screen.height)<600||(/Linux (arm|aarch)|Android/i.test(navigator.platform)&&!/CrOS/.test(navigator.userAgent)))))   // phone-sized or Android touch screen, even with a stylus or mouse
            document.documentElement.setAttribute('data-desktop-only', '');
        } catch (e) {}
      })();
    </script>
    <script>
      // The loading cover plays once every six hours; otherwise the page is simply there
      // (and later entrances skip their delay). Storage can throw in private mode: then it plays.
      // Any click or key ends the cover at once.
      (function () {
        var h = document.documentElement
        var skip = function () { h.setAttribute('data-no-cover', ''); h.setAttribute('data-entered', '') }
        try {
          var k = 'bld-cover', n = Date.now(), t = +localStorage.getItem(k) || 0
          if (n - t < 216e5) skip()
          else localStorage.setItem(k, String(n))
        } catch (e) {}
        addEventListener('pointerdown', skip, { once: true })
        addEventListener('keydown', skip, { once: true })
        // once the cover has lifted and the first page has assembled, later pages arrive in place
        setTimeout(skip, 3500)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
